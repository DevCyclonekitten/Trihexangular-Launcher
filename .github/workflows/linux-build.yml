name: Compile Linux Build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install customtkinter
          pip install requests
          pip install Pillow

      - name: Compile Linux x86 Executable
        run: |
          pyinstaller --onefile --icon="Updater/logo.ico" --distpath ./OUTPUT "Updater/main.pyw"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-maintainer.x86_64
          path: OUTPUT/