name: Compile Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compile Windows File
        run: |
          pyinstaller --onefile --icon="Client Updater/logo.ico" --distpath ./OUTPUT "Client Updater/main.pyw"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-maintainer.exe
          path: OUTPUT/